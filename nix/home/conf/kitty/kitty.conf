enable_audio_bell false
confirm_os_window_close 0

shell zsh

# Floating window
map super+shift+n launch --type=os-window --os-window-class floating_kitty tmux new-session -A -s popup

# Font
font_size 24

font_family family="SFMono Nerd Font"

# Catppuccin Mocha palette
foreground            #cdd6f4
background            #0d1117
selection_foreground  #dcdcdc
selection_background  #40375e
cursor                #f5e0dc
cursor_text_color     #1e1e2e
url_color             #287bde

# black
color0  #45475a
color8  #585b70

# red
color1  #f38ba8
color9  #f38ba8

# green
color2  #a6e3a1
color10 #a6e3a1

# yellow
color3  #f9e2af
color11 #f9e2af

# blue
color4  #89b4fa
color12 #89b4fa

# magenta
color5  #f5c2e7
color13 #f5c2e7

# cyan
color6  #94e2d5
color14 #94e2d5

# white
color7  #bac2de
color15 #bac2de

# tmux keybinds

# open new tmux window (tab)
map ctrl+t send_text all \x02c

# close tmux window (tab)
map ctrl+w send_text all \x02&

# cmd+k to clear the terminal
map ctrl+k send_text all \x0c

# tmux next/previous window
map ctrl+tab send_text all \x02n
map ctrl+shift+tab send_text all \x02p

# cmd+c to copy
map ctrl+c copy_to_clipboard

# cmd+v to paste
map ctrl+v paste_from_clipboard

map super+n new_os_window
