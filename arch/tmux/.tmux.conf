unbind-key &
bind-key & kill-window

unbind %
unbind '"'
unbind !
unbind <
unbind >
unbind q
unbind o
unbind z
bind-key W kill-window

# Status bar

set -g status on

set -g status-left "  "

set -g window-status-style "bg=default,fg=colour8"
set -g window-status-current-style "bg=default,fg=colour7"

setw -g window-status-format "#[fg=colour8, reverse]▓▒░ #W ░▒▓"
setw -g window-status-current-format "#[fg=colour7, reverse]▓▒░ #W ░▒▓"

set -g status-right "%H:%M"

set -g status-style bg=default
set -g status-fg white

set -g base-index 1

set -g status-justify centre
