general = {
    // Device name shown on Apple Devices
    name = "mac";
 
    // Audio backend: "alsa", "pulse", or "pw"
    output_backend = "alsa";
 
    // Resampling interpolation: "auto", "soxr", or "vernier"
    interpolation = "soxr";
};
 
alsa = {
    output_device = "plughw:1,0";  // card 1, device 0 (aplay -l)
    mixer_control = "PCM";
    output_rate = "auto";          // no Hi-Res Lossless in shairport :(
    output_format = "S16";
};
 
metadata = {
    enabled = "yes";
    include_cover_art = "yes";
    pipe_name = "/tmp/shairport-sync-metadata";
};

