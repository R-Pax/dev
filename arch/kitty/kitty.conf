enable_audio_bell false
confirm_os_window_close 0

# Floating window
map super+shift+n launch --type=os-window --os-window-class floating_kitty tmux new-session -A -s popup

# Font
font_size 20

font_family FantasqueSansM Nerd Font Mono

# Color palette (https://plugins.jetbrains.com/plugin/22022-ppy-colours/)
foreground            #abb2bf
background            #0d1117
selection_foreground  #dcdcdc
selection_background  #40375e
cursor                #dedede
cursor_text_color     #20202a
url_color             #287bde

# black
color0  #22222e
color8  #5c6370

# red
color1  #fb7385
color9  #ff4e4e

# green
color2  #98c379
color10 #98c379

# yellow
color3  #e5bc66
color11 #ffc423

# blue
color4  #61afef
color12 #379aef

# magenta
color5  #ce95b8
color13 #ed88b2

# cyan
color6  #4c9eca
color14 #76a1ce

# white
color7  #dcdcdc
color15 #e5e5e5

# tmux keybinds

# open new tmux window (tab)
map ctrl+t send_text all \x02c

# close tmux window (tab)
map ctrl+w send_text all \x02&

# cmd+k to clear the terminal
map ctrl+k send_text all \x0c

# tmux next/previous window
map ctrl+tab send_text all \x02n
map ctrl+shift+tab send_text all \x02p
