# Kitty config

background_image ~/Documents/dev/arch/kitty/wolf.png
background_image_layout centered
background_opacity 0.9
background_blur 16

# Font
font_size 30

font_family FantasqueSansM Nerd Font Mono

# Main colors
foreground #c0b18b
background #212121

# black
color0 #2f2f2f

# red
color1 #d75f5f

# green
color2 #d4d232

# yellow
color3 #af865a

# blue
color4 #22c3a1

# magenta
color5 #775759

# cyan
color6 #84edb9

# white
color7   #c0b18b

# tmux keybinds

# open new tmux window (tab)
map ctrl+t send_text all \x02c

# close tmux window (tab)
map ctrl+w send_text all \x02&

# cmd+k to clear the terminal
map ctrl+k send_text all \x0c

# tmux next/previous window
map ctrl+tab send_text all \x02n
map ctrl+shift+tab send_text all \x02p
