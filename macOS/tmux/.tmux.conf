unbind-key &
bind-key & kill-window

unbind %
unbind '"'
unbind !
unbind <
unbind >
unbind q
unbind o
unbind z
bind-key W kill-window

# Status bar

set -g status on

set -g status-left "  | "

setw -g window-status-format "#[bg=default,fg=colour8,reverse]▓▒░ #W ░▒▓"
setw -g window-status-current-format "#[bg=default,fg=colour7,reverse]▓▒░ #W ░▒▓"

set -g status-right "%H:%M"

set -g status-bg black
set -g status-fg white

set -g base-index 1
