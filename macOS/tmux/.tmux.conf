unbind-key &
bind-key & kill-window

unbind %
unbind '"'
unbind !
unbind <
unbind >
unbind q
unbind o
unbind z
bind-key W kill-window

# Status bar

set -g status on

set -g status-left "  "

set -g window-status-format "#W"
set -g window-status-current-format "#W *"

set -g status-right "%H:%M"

set -g status-bg black
set -g status-fg white

set -g base-index 1
